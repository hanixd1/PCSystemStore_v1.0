# Product catalog rules (phase F2). Products are free text without SKU codes; a SKU is the set of
# texts that share the same normalised token key. The company can merge or rename SKUs with
# `merges`. Categories are assigned by the first matching rule (patterns run on the
# accent-free, upper-case text).
status: frozen

# Token replacements applied before building the SKU key (typing variants of the same word).
synonyms:
  WESTER: WESTERN
  GDRR6: GDDR6
  AUDIFONOS: AUDIFONO
  AURICULARES: AUDIFONO
  CASTE: CASE
  PLACA: MOTHERBOARD
  MOTHERBORAD: MOTHERBOARD
  MINITOR: MONITOR

# Tokens ignored in the SKU key.
stopwords: [DE, CON, Y, EL, LA, PARA]

categories:
  - id: storage
    label: Almacenamiento
    pattern: '^(DISCO|SSD|UNIDAD SSD|M\.2)\b|\bNVME\b'
  - id: memory
    label: Memoria RAM
    pattern: '^(MEMORIA|RAM)\b'
  - id: cpu
    label: Procesador
    pattern: '^PROCESADOR\b'
  - id: motherboard
    label: Placa madre
    pattern: '^(MOTHERBOARD|MOTHERBORAD|PLACA|MAINBOARD)\b'
  - id: gpu
    label: Tarjeta de video
    pattern: '^TARJETA DE VIDEO\b|\b(RTX|GTX|RX)\s?\d{3,4}\b'
  - id: psu
    label: Fuente de poder
    pattern: '^FUENTE\b'
  - id: case
    label: Case
    pattern: '^(CASE|CASTE|GABINETE)\b'
  - id: cooling
    label: Refrigeración
    pattern: '^(COOLER|FAN|VENTILADOR(ES)?|PASTA TERMICA|THERMAL|PAD TERMICO)\b|\bREFRIGERACION\b'
  - id: keyboard_mouse
    label: Teclado y mouse
    pattern: '^(TECLADO|MOUSE|KIT TECLADO|COMBO)\b'
  - id: audio
    label: Audio
    pattern: '^(AUDIFONO|AUDIFONOS|AURICULARES|MICROFONO|ALTAVOCES|PARLANTE|DIADEMA)\b'
  - id: monitor
    label: Monitor
    pattern: '^(MONITOR|MINITOR|MON)\b'
  - id: power_protection
    label: Estabilizador / UPS
    pattern: '^(ESTABILIZADOR|UPS|SUPRESOR)\b'
  - id: accessory
    label: Accesorios
    pattern: '^(GAMEPAD|MANDO|SILLA|ALFOMBRILLA|PAD|MOUSE PAD|REPOSA|WEBCAM|MOCHILA(S)?)\b'

fallback_category:
  id: other
  label: Otros


sonar.projectKey=pcsforecast
sonar.projectName=sistema-pronostico (pcsforecast)
sonar.sourceEncoding=UTF-8

sonar.sources=src,app
sonar.tests=tests
sonar.exclusions=notebooks/**
# Streamlit UI: a thin presentation layer over pcsforecast.reporting, which is fully tested.
sonar.coverage.exclusions=app/**
sonar.python.version=3.12

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.python.ruff.reportPaths=reports/ruff.json
sonar.python.mypy.reportPaths=reports/mypy.txt

sonar.qualitygate.wait=true

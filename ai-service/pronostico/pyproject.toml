[project]
name = "pcsforecast"
version = "0.1.0"
description = "Comparative demand-forecasting system for PCSystemStore (thesis research artifact)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PCSystemStore thesis author" }]
# Production (pcsforecast.service, installed by the ai-service): only what serving reads.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Research pipeline (ingest, validation, models, `pcs` CLI). Installed by `uv sync` through the
# dev group; never by the ai-service in production.
research = [
    "openpyxl>=3.1",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "typer>=0.12",
    "lightgbm>=4.5",
    "pdfplumber>=0.11",
    "scipy>=1.14",
]
# Pretrained time-series foundation models (phase F5). Heavy: PyTorch.
foundation = [
    "torch>=2.4",
    "chronos-forecasting>=1.5",
]
# Hypothesis testing and reporting (phase F7).
stats = [
    "scipy>=1.14",
    "scikit-posthocs>=0.10",
    "matplotlib>=3.9",
]
# Production service mounted by the ai-service (F11).
service = [
    "fastapi>=0.115",
]
# Read-only results dashboard (phase F7).
app = [
    "streamlit>=1.40",
]

[project.scripts]
pcs = "pcsforecast.cli:app"

[dependency-groups]
dev = [
    "pcsforecast[research]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcsforecast"]

[tool.uv]
default-groups = ["dev"]

# Linux (Docker) uses CPU-only PyTorch wheels; macOS keeps PyPI wheels (MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "PTH", "RUF", "C90", "PL", "S", "DTZ", "PD", "NPY"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "DTZ001"]  # Excel dates are naive

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pandera.*", "lightgbm.*", "scipy", "scipy.*", "chronos", "chronos.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=pcsforecast --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml"
markers = [
    "integration: end-to-end tests that touch the filesystem or several modules",
]

[tool.coverage.run]
source = ["pcsforecast"]
relative_files = true
# Measure checks that must run in their own process (PyTorch next to LightGBM, ADR-0009).
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true

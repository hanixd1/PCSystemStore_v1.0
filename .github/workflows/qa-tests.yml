name: QA tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-service-unit:
    name: AI service unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  forecast-package:
    name: Forecast package tests (pcsforecast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service/pronostico
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12 --extra stats --extra service
      - run: uv run --no-sync pytest -p no:cacheprovider

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # The frontend uses pnpm (packageManager in package.json); it has no package-lock.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  backend-e2e-qa:
    name: Backend QA E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcsystemstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pcsystemstore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pcsystemstore_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/pcsystemstore_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pcsystemstore_test?schema=public
      JWT_SECRET: test-jwt-secret
      JWT_SECRET_TEST: test-jwt-secret
      JWT_EXPIRES_IN: 1h
      PAYMENTS_ENABLED: "true"
      PAYMENT_SIMULATION_ENABLED: "true"
      CHECKOUT_MODE: DIRECT_PAYMENT
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:qa
